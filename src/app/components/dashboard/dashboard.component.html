<div class="dashboard-layout">
  <header class="panel header">
    Header
  </header>

  <section class="middle-row">
    <div class="panel">Pane 1</div>
    <div class="panel">Pane 2</div>
    <div class="panel">Pane 3</div>

  <section class="panel bottom">

    </ag-grid-angular>
  </section>
</div>
