<div class="dashboard-layout">
  <header class="panel header">
  </header>

  <section class="middle-row">
    <div class="panel">
      <canvas #salesChart1></canvas>
    </div>
    <div class="panel">
      <canvas #salesChart2></canvas>
    </div>
    <div class="panel">
      <canvas #salesChart3></canvas>
    </div>
  </section>

  <section class="panel bottom">
    <div class="dialog-demo">
      <div class="dialog-demo__actions">
        <p-button type="button" label="Confirm" (onClick)="onConfirmDemo()" />
        <p-button type="button" severity="danger" label="Confirm Delete" (onClick)="onConfirmDeleteDemo()" />
        <p-button type="button" severity="secondary" label="Confirm Popup" (onClick)="onConfirmPopupDemo($event)" />
        <p-button type="button" severity="secondary" label="Open Dialog" (onClick)="dialogVisible.set(true)" />
        <p-button type="button" severity="secondary" label="Open Drawer" (onClick)="drawerVisible.set(true)" />
        <p-button type="button" severity="secondary" label="Dynamic Dialog" (onClick)="onOpenDynamicDemo()" />
      </div>
      @if (dialogResult()) {
        <p class="dialog-demo__result">{{ dialogResult() }}</p>
      }
    </div>

    <app-dialog
      [config]="dialogConfig"
      [(visible)]="dialogVisible"
      (footerAction)="onDialogFooter($event.buttonId)"
    >
      <p>Config-driven dialog body. Footer buttons come from dialog config.</p>
    </app-dialog>

    <app-drawer
      [config]="drawerConfig"
      [(visible)]="drawerVisible"
      (footerAction)="onDrawerFooter($event.buttonId)"
    >
      <p>Drawer content for filters or detail panels.</p>
    </app-drawer>

    <div class="form-demo">
      <h3>Form Demo</h3>
      <app-form
        [config]="customerFormConfig"
        [value]="customerFormValue"
        (submit)="onCustomerFormSubmit($event)"
        (cancel)="onCustomerFormCancel()"
        (valueChange)="onCustomerFormValueChange($event)"
      />
    </div>

    <app-toolbar [config]="toolbarConfig" (action)="onToolbarAction($event)" />
    <app-grid
      [config]="gridConfig"
      [data]="rowData"
    />
  </section>
</div>
