<div class="dashboard-layout">
  <section class="panel bottom">
    <div class="dialog-demo">
      <div class="dialog-demo__actions">
        <button pButton type="button" (click)="onConfirmDemo()">Confirm</button>
        <button pButton type="button" severity="danger" (click)="onConfirmDeleteDemo()">Confirm Delete</button>
        <button pButton type="button" severity="secondary" (click)="onConfirmPopupDemo($event)">Confirm Popup</button>
        <button pButton type="button" severity="secondary" (click)="dialogVisible.set(true)">Open Dialog</button>
        <button pButton type="button" severity="secondary" (click)="drawerVisible.set(true)">Open Drawer</button>
        <button pButton type="button" severity="secondary" (click)="onOpenDynamicDemo()">Dynamic Dialog</button>
      </div>
      @if (dialogResult()) {
        <p class="dialog-demo__result">{{ dialogResult() }}</p>
      }
    </div>

    <app-dialog
      [config]="dialogConfig"
      [(visible)]="dialogVisible"
      (footerAction)="onDialogFooter($event.buttonId)"
    >
      <p>Config-driven dialog body. Footer buttons come from dialog config.</p>
    </app-dialog>

    <app-drawer
      [config]="drawerConfig"
      [(visible)]="drawerVisible"
      (footerAction)="onDrawerFooter($event.buttonId)"
    >
      <p>Drawer content for filters or detail panels.</p>
    </app-drawer>

    <div class="form-demo">
      <h3>Form Demo</h3>
      <app-form
        [config]="customerFormConfig"
        [value]="customerFormValue"
        (submit)="onCustomerFormSubmit($event)"
        (cancel)="onCustomerFormCancel()"
        (valueChange)="onCustomerFormValueChange($event)"
      />
    </div>

    <app-toolbar [config]="toolbarConfig" (action)="onToolbarAction($event)" />
    <app-grid
      [config]="gridConfig"
      [data]="rowData"
    />
  </section>
</div>
