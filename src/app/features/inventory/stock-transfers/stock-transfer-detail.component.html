<p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)">
  <p-tablist>
    <p-tab value="overview">Overview</p-tab>
    @if (transferId()) {
      <p-tab value="items">Items</p-tab>
    }
  </p-tablist>
  <p-tabpanels>
    <p-tabpanel value="overview">
      @if (!isNew()) {
        <p class="detail-form__status">Status: {{ status() }}</p>
      }
      <form class="detail-form" [formGroup]="form" (ngSubmit)="save()">
        <div class="detail-form__field">
          <label for="sourceBranchId">Source Branch ID</label>
          <input pInputText id="sourceBranchId" formControlName="sourceBranchId" [readonly]="!isNew()" />
        </div>
        <div class="detail-form__field">
          <label for="destinationBranchId">Destination Branch ID</label>
          <input pInputText id="destinationBranchId" formControlName="destinationBranchId" [readonly]="!isNew()" />
        </div>
        <div class="detail-form__field">
          <label for="transferDate">Transfer Date</label>
          <input pInputText id="transferDate" formControlName="transferDate" [readonly]="!isDraft()" />
        </div>
        <div class="detail-form__field">
          <label for="transferType">Transfer Type</label>
          <input pInputText id="transferType" formControlName="transferType" [readonly]="!isDraft()" />
        </div>
        <div class="detail-form__field">
          <label for="expectedArrivalDate">Expected Arrival Date</label>
          <input pInputText id="expectedArrivalDate" formControlName="expectedArrivalDate" [readonly]="!isDraft()" />
        </div>
        <div class="detail-form__field">
          <label for="remarks">Remarks</label>
          <input pInputText id="remarks" formControlName="remarks" [readonly]="!isDraft()" />
        </div>
        <div class="detail-form__actions">
          @if (isDraft()) {
            <button pButton type="submit" severity="primary" [disabled]="saving() || form.invalid">
              Save
            </button>
          }
          @if (!isNew() && canDispatch()) {
            <button pButton type="button" severity="success" [disabled]="dispatching()" (click)="dispatch()">
              Dispatch
            </button>
          }
          @if (!isNew() && canReceive()) {
            <button pButton type="button" severity="success" [disabled]="receiving()" (click)="receive()">
              Receive
            </button>
          }
          @if (!isNew() && isDraft()) {
            <button pButton type="button" severity="danger" [disabled]="deleting()" (click)="deleteRecord()">
              Delete
            </button>
          }
          <button pButton type="button" severity="secondary" variant="outlined" (click)="goBack()">
            Back
          </button>
        </div>
        @if (errorMessage()) {
          <p class="detail-form__error">{{ errorMessage() }}</p>
        }
      </form>
    </p-tabpanel>
    @if (transferId()) {
      <p-tabpanel value="items">
        <app-stock-transfer-items-tab
          [transferId]="transferId()!"
          [editable]="isDraft()"
        />
      </p-tabpanel>
    }
  </p-tabpanels>
</p-tabs>
