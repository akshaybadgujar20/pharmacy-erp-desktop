<div class="nested-tab">
  <div class="nested-tab__actions">
    <button pButton type="button" severity="primary" (click)="openCreate()">New Item</button>
  </div>
  <app-grid
    [config]="gridConfig"
    [data]="rows()"
    [loading]="loading()"
    [totalRecords]="totalRecords()"
    (pageChange)="onPageChange($event)"
    (filterChange)="onFilterChange($event)"
    (action)="onGridAction($event)"
  />
</div>

<p-dialog
  [visible]="dialogVisible()"
  [modal]="true"
  [header]="editingId() ? 'Edit Item' : 'New Item'"
  [style]="{ width: '32rem' }"
  (onHide)="closeDialog()"
>
  <form class="detail-form" [formGroup]="form" (ngSubmit)="save()">
    <div class="detail-form__field">
      <label for="medicineId">Medicine ID</label>
      <input pInputText id="medicineId" formControlName="medicineId" [readonly]="!!editingId()" />
    </div>
    <div class="detail-form__field">
      <label for="sellingPrice">Selling Price</label>
      <input pInputText id="sellingPrice" formControlName="sellingPrice" />
    </div>
    <div class="detail-form__field">
      <label for="mrp">MRP</label>
      <input pInputText id="mrp" formControlName="mrp" />
    </div>
    <div class="detail-form__field">
      <label for="minimumSellingPrice">Minimum Selling Price</label>
      <input pInputText id="minimumSellingPrice" formControlName="minimumSellingPrice" />
    </div>
    <div class="detail-form__field">
      <label for="discountPercent">Discount Percent</label>
      <input pInputText id="discountPercent" formControlName="discountPercent" />
    </div>
    <div class="detail-form__field">
      <label for="taxId">Tax ID</label>
      <input pInputText id="taxId" formControlName="taxId" />
    </div>
    <div class="detail-form__field">
      <label for="itemEffectiveFrom">Effective From</label>
      <input pInputText id="itemEffectiveFrom" formControlName="effectiveFrom" />
    </div>
    <div class="detail-form__field">
      <label for="itemEffectiveTo">Effective To</label>
      <input pInputText id="itemEffectiveTo" formControlName="effectiveTo" />
    </div>
    <div class="detail-form__field">
      <p-checkbox formControlName="isActive" [binary]="true" inputId="priceListItemIsActive" />
      <label for="priceListItemIsActive">Active</label>
    </div>
    <div class="detail-form__field">
      <label for="itemRemarks">Remarks</label>
      <input pInputText id="itemRemarks" formControlName="remarks" />
    </div>
    <div class="detail-form__actions">
      <button pButton type="submit" severity="primary" [disabled]="saving() || form.invalid">
        Save
      </button>
      <button pButton type="button" severity="secondary" variant="outlined" (click)="closeDialog()">
        Cancel
      </button>
    </div>
  </form>
</p-dialog>
