<div class="page-layout">
  <div class="setting-categories">
    <button type="button" (click)="filterCategory('')">All</button>
    @for (category of categories(); track category) {
      <button type="button" (click)="filterCategory(category)">{{ category }}</button>
    }
    <a routerLink="/security/change-password">Change password</a>
  </div>
  <app-toolbar [config]="toolbarConfig" (action)="onToolbarAction($event)" />
  <app-grid
    [config]="gridConfig"
    [data]="rows()"
    [loading]="loading()"
    (action)="onGridAction($event)"
    (rowDoubleClick)="onRowDoubleClick($event)"
  />
</div>
