<div class="login-page">
  <div class="login-card">
    <h1>{{ 'auth.changeRequiredPasswordTitle' | translate }}</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <input pInputText formControlName="username" [placeholder]="'auth.username' | translate" />
      <input
        pInputText
        type="password"
        formControlName="currentPassword"
        [placeholder]="'auth.currentPassword' | translate"
      />
      <input
        pInputText
        type="password"
        formControlName="newPassword"
        [placeholder]="'auth.newPassword' | translate"
      />
      <button pButton type="submit" [disabled]="saving() || form.invalid">
        {{ 'auth.updatePassword' | translate }}
      </button>
      @if (message()) {
        <p class="error">{{ message() }}</p>
      }
    </form>
    <a routerLink="/login">{{ 'auth.backToLogin' | translate }}</a>
  </div>
</div>
