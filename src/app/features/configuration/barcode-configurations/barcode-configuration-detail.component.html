<form class="detail-form" [formGroup]="form" (ngSubmit)="save()">
  <div class="detail-form__field">
    <label for="branchId">Branch ID</label>
    <input pInputText id="branchId" formControlName="branchId" />
  </div>
  <div class="detail-form__field">
    <label for="configurationName">Configuration Name</label>
    <input pInputText id="configurationName" formControlName="configurationName" />
  </div>
  <div class="detail-form__field">
    <label for="barcodeType">Barcode Type</label>
    <input pInputText id="barcodeType" formControlName="barcodeType" />
  </div>
  <div class="detail-form__field">
    <label for="appliesTo">Applies To</label>
    <input pInputText id="appliesTo" formControlName="appliesTo" />
  </div>
  <div class="detail-form__field">
    <label for="labelWidth">Label Width</label>
    <input pInputText id="labelWidth" formControlName="labelWidth" />
  </div>
  <div class="detail-form__field">
    <label for="labelHeight">Label Height</label>
    <input pInputText id="labelHeight" formControlName="labelHeight" />
  </div>
  <div class="detail-form__field">
    <label for="dpi">DPI</label>
    <input pInputText id="dpi" type="number" formControlName="dpi" />
  </div>
  <div class="detail-form__field">
    <p-checkbox formControlName="showHumanReadableText" [binary]="true" inputId="showHumanReadableText" />
    <label for="showHumanReadableText">Show Human Readable Text</label>
  </div>
  <div class="detail-form__field">
    <label for="template">Template</label>
    <input pInputText id="template" formControlName="template" />
  </div>
  <div class="detail-form__field">
    <p-checkbox formControlName="isDefault" [binary]="true" inputId="isDefault" />
    <label for="isDefault">Default</label>
  </div>
  <div class="detail-form__field">
    <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive" />
    <label for="isActive">Active</label>
  </div>
  <div class="detail-form__field">
    <label for="remarks">Remarks</label>
    <input pInputText id="remarks" formControlName="remarks" />
  </div>
  <div class="detail-form__actions">
    <button pButton type="submit" severity="primary" [disabled]="saving() || form.invalid">
      Save
    </button>
    @if (!isNew()) {
      <button pButton type="button" severity="danger" [disabled]="deleting()" (click)="deleteRecord()">
        Delete
      </button>
    }
    <button pButton type="button" severity="secondary" variant="outlined" (click)="goBack()">
      Back
    </button>
  </div>
  @if (errorMessage()) {
    <p class="detail-form__error">{{ errorMessage() }}</p>
  }
</form>
