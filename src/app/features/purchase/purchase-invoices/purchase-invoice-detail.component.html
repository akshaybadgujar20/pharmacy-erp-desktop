<p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)">
  <p-tablist>
    <p-tab value="overview">Overview</p-tab>
    @if (invoiceId()) {
      <p-tab value="items">Items</p-tab>
    }
  </p-tablist>
  <p-tabpanels>
    <p-tabpanel value="overview">
      @if (!isNew()) {
        <p class="detail-form__status">Status: {{ status() }}</p>
      }
      <form class="detail-form" [formGroup]="form" (ngSubmit)="save()">
        <div class="detail-form__field">
          <label for="branchId">Branch ID</label>
          <input pInputText id="branchId" formControlName="branchId" [readonly]="!isNew()" />
        </div>
        <div class="detail-form__field">
          <label for="supplierId">Supplier ID</label>
          <input pInputText id="supplierId" formControlName="supplierId" [readonly]="!isDraft()" />
        </div>
        <div class="detail-form__field">
          <label for="supplierInvoiceNumber">Supplier Invoice Number</label>
          <input
            pInputText
            id="supplierInvoiceNumber"
            formControlName="supplierInvoiceNumber"
            [readonly]="!isDraft()"
          />
        </div>
        <div class="detail-form__field">
          <label for="goodsReceiptId">Goods Receipt ID</label>
          <input pInputText id="goodsReceiptId" formControlName="goodsReceiptId" [readonly]="!isDraft()" />
        </div>
        <div class="detail-form__field">
          <label for="invoiceDate">Invoice Date</label>
          <input pInputText id="invoiceDate" formControlName="invoiceDate" [readonly]="!isDraft()" />
        </div>
        <div class="detail-form__field">
          <label for="dueDate">Due Date</label>
          <input pInputText id="dueDate" formControlName="dueDate" [readonly]="!isDraft()" />
        </div>
        <div class="detail-form__field">
          <label for="remarks">Remarks</label>
          <input pInputText id="remarks" formControlName="remarks" [readonly]="!isDraft()" />
        </div>
        <div class="detail-form__actions">
          @if (isDraft()) {
            <button pButton type="submit" severity="primary" [disabled]="saving() || form.invalid">
              Save
            </button>
          }
          @if (!isNew() && canPost()) {
            <button
              pButton
              type="button"
              severity="success"
              [disabled]="workflowRunning() === 'post'"
              (click)="post()"
            >
              Post
            </button>
          }
          @if (!isNew() && canCancel()) {
            <button
              pButton
              type="button"
              severity="danger"
              [disabled]="workflowRunning() === 'cancel'"
              (click)="cancel()"
            >
              Cancel
            </button>
          }
          @if (!isNew() && isDraft()) {
            <button pButton type="button" severity="danger" [disabled]="deleting()" (click)="deleteRecord()">
              Delete
            </button>
          }
          <button pButton type="button" severity="secondary" variant="outlined" (click)="goBack()">
            Back
          </button>
        </div>
        @if (errorMessage()) {
          <p class="detail-form__error">{{ errorMessage() }}</p>
        }
      </form>
    </p-tabpanel>
    @if (invoiceId()) {
      <p-tabpanel value="items">
        <app-purchase-invoice-items-tab [invoiceId]="invoiceId()!" [editable]="isDraft()" />
      </p-tabpanel>
    }
  </p-tabpanels>
</p-tabs>
