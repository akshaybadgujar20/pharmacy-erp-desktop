<form class="detail-form" [formGroup]="form" (ngSubmit)="save()">
  <div class="detail-form__field">
    <label for="cityId">City ID</label>
    <input pInputText id="cityId" formControlName="cityId" />
  </div>
  <div class="detail-form__field">
    <label for="areaCode">Area Code</label>
    <input pInputText id="areaCode" formControlName="areaCode" />
  </div>
  <div class="detail-form__field">
    <label for="areaName">Area Name</label>
    <input pInputText id="areaName" formControlName="areaName" />
  </div>
  <div class="detail-form__field">
    <label for="postalCode">Postal Code</label>
    <input pInputText id="postalCode" formControlName="postalCode" />
  </div>
  <div class="detail-form__field">
    <label for="deliveryZone">Delivery Zone</label>
    <input pInputText id="deliveryZone" formControlName="deliveryZone" />
  </div>
  <div class="detail-form__field">
    <label for="routeCode">Route Code</label>
    <input pInputText id="routeCode" formControlName="routeCode" />
  </div>
  <div class="detail-form__field">
    <label for="latitude">Latitude</label>
    <input pInputText id="latitude" type="number" formControlName="latitude" />
  </div>
  <div class="detail-form__field">
    <label for="longitude">Longitude</label>
    <input pInputText id="longitude" type="number" formControlName="longitude" />
  </div>
  <div class="detail-form__field">
    <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive" />
    <label for="isActive">Active</label>
  </div>
  <div class="detail-form__actions">
    <button pButton type="submit" severity="primary" [disabled]="saving() || form.invalid">
      Save
    </button>
    @if (!isNew()) {
      <button pButton type="button" severity="danger" [disabled]="deleting()" (click)="deleteRecord()">
        Delete
      </button>
    }
    <button pButton type="button" severity="secondary" variant="outlined" (click)="goBack()">
      Back
    </button>
  </div>
  @if (errorMessage()) {
    <p class="detail-form__error">{{ errorMessage() }}</p>
  }
</form>
