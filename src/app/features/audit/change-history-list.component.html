<div class="flex gap-2 mb-2">
  <input pInputText type="text" placeholder="Entity type" [ngModel]="entityType()" (ngModelChange)="entityType.set($event); onFilterApply()" />
  <input pInputText type="text" placeholder="Entity ID" [ngModel]="entityId()" (ngModelChange)="entityId.set($event); onFilterApply()" />
</div>
<app-toolbar [config]="toolbarConfig" (action)="onToolbarAction($event)" />
<app-grid
  [config]="gridConfig"
  [data]="rows()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  (pageChange)="onPageChange($event)"
  (filterChange)="onFilterChange($event)"
/>
