<div class="nested-tab">
  <div class="nested-tab__actions">
    <button pButton type="button" severity="primary" (click)="openCreate()">New Permission</button>
  </div>
  <app-grid
    [config]="gridConfig"
    [data]="rows()"
    [loading]="loading()"
    [totalRecords]="totalRecords()"
    (pageChange)="onPageChange($event)"
    (filterChange)="onFilterChange($event)"
    (action)="onGridAction($event)"
  />
</div>

<p-dialog
  [visible]="dialogVisible()"
  [modal]="true"
  [header]="editingId() ? 'Edit Role Permission' : 'New Role Permission'"
  [style]="{ width: '28rem' }"
  (onHide)="closeDialog()"
>
  <form class="detail-form" [formGroup]="form" (ngSubmit)="save()">
    <div class="detail-form__field">
      <label for="permissionId">Permission ID</label>
      <input
        pInputText
        id="permissionId"
        formControlName="permissionId"
        [readonly]="!!editingId()"
      />
    </div>
    <div class="detail-form__field">
      <p-checkbox formControlName="isGranted" [binary]="true" inputId="rolePermissionIsGranted" />
      <label for="rolePermissionIsGranted">Granted</label>
    </div>
    <div class="detail-form__actions">
      <button pButton type="submit" severity="primary" [disabled]="saving() || form.invalid">
        Save
      </button>
      <button pButton type="button" severity="secondary" variant="outlined" (click)="closeDialog()">
        Cancel
      </button>
    </div>
  </form>
</p-dialog>
