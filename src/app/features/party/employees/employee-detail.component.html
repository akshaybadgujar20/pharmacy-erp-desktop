<form class="detail-form" [formGroup]="form" (ngSubmit)="save()">
  <div class="detail-form__field">
    <label for="partyId">Party</label>
    <app-party-lookup id="partyId" formControlName="partyId" />
    @if (form.controls.partyId.invalid && form.controls.partyId.touched) {
      <small class="detail-form__field-error">{{ 'common.required' | translate }}</small>
    }
  </div>
  <div class="detail-form__field">
    <label for="employeeCode">Employee Code</label>
    <input pInputText id="employeeCode" formControlName="employeeCode" />
    @if (form.controls.employeeCode.invalid && form.controls.employeeCode.touched) {
      <small class="detail-form__field-error">{{ 'common.required' | translate }}</small>
    }
  </div>
  <div class="detail-form__field">
    <label for="designation">Designation</label>
    <input pInputText id="designation" formControlName="designation" />
  </div>
  <div class="detail-form__field">
    <label for="department">Department</label>
    <input pInputText id="department" formControlName="department" />
  </div>
  <div class="detail-form__field">
    <label for="salary">Salary</label>
    <p-inputnumber inputId="salary" formControlName="salary" mode="decimal" [minFractionDigits]="2" />
  </div>
  <div class="detail-form__field">
    <label for="licenseNumber">License Number</label>
    <input pInputText id="licenseNumber" formControlName="licenseNumber" />
  </div>
  <div class="detail-form__field">
    <p-checkbox formControlName="isPharmacist" [binary]="true" inputId="isPharmacist" />
    <label for="isPharmacist">Pharmacist</label>
  </div>
  <div class="detail-form__field">
    <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive" />
    <label for="isActive">Active</label>
  </div>
  <div class="detail-form__actions">
    <button pButton type="submit" severity="primary" [disabled]="saving() || form.invalid" appShortcutTooltip="Save" shortcutId="global.save" shortcutTooltipPosition="bottom">
      Save
    </button>
    @if (!isNew()) {
      <button appShortcutTooltip="Delete" shortcutId="global.delete" shortcutTooltipPosition="bottom" pButton type="button" severity="danger" [disabled]="deleting()" (click)="deleteRecord()">
        Delete
      </button>
    }
    <button appShortcutTooltip="Back" shortcutId="global.cancel" shortcutTooltipPosition="bottom" pButton type="button" severity="secondary" variant="outlined" (click)="goBack()">
      Back
    </button>
  </div>
  @if (errorMessage()) {
    <p class="detail-form__error">{{ errorMessage() }}</p>
  }
</form>
