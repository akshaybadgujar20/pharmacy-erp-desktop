<form class="detail-form" [formGroup]="form" (ngSubmit)="save()">
  <div class="detail-form__field">
    <label for="partyId">Party</label>
    <app-party-lookup id="partyId" formControlName="partyId" />
    @if (form.controls.partyId.invalid && form.controls.partyId.touched) {
      <small class="detail-form__field-error">{{ 'common.required' | translate }}</small>
    }
  </div>
  <div class="detail-form__field">
    <label for="supplierCode">Supplier Code</label>
    <input pInputText id="supplierCode" formControlName="supplierCode" />
    @if (form.controls.supplierCode.invalid && form.controls.supplierCode.touched) {
      <small class="detail-form__field-error">{{ 'common.required' | translate }}</small>
    }
  </div>
  <div class="detail-form__field">
    <label for="supplierType">Supplier Type</label>
    <p-select inputId="supplierType" formControlName="supplierType" [options]="supplierTypeOptions" optionLabel="label" optionValue="value" appendTo="body" styleClass="w-full" />
  </div>
  <div class="detail-form__field">
    <label for="gstin">GSTIN</label>
    <input pInputText id="gstin" formControlName="gstin" />
  </div>
  <div class="detail-form__field">
    <label for="drugLicenseNumber">Drug License</label>
    <input pInputText id="drugLicenseNumber" formControlName="drugLicenseNumber" />
  </div>
  <div class="detail-form__field">
    <label for="panNumber">PAN</label>
    <input pInputText id="panNumber" formControlName="panNumber" />
  </div>
  <div class="detail-form__field">
    <label for="creditLimit">Credit Limit</label>
    <p-inputnumber inputId="creditLimit" formControlName="creditLimit" mode="decimal" [minFractionDigits]="2" />
  </div>
  <div class="detail-form__field">
    <label for="paymentTermsDays">Payment Terms (days)</label>
    <p-inputnumber inputId="paymentTermsDays" formControlName="paymentTermsDays" [min]="0" />
  </div>
  <div class="detail-form__field">
    <p-checkbox formControlName="preferredSupplier" [binary]="true" inputId="preferredSupplier" />
    <label for="preferredSupplier">Preferred Supplier</label>
  </div>
  <div class="detail-form__field">
    <p-checkbox formControlName="isActive" [binary]="true" inputId="isActive" />
    <label for="isActive">Active</label>
  </div>
  <div class="detail-form__actions">
    <button pButton type="submit" severity="primary" [disabled]="saving() || form.invalid" appShortcutTooltip="Save" shortcutId="global.save" shortcutTooltipPosition="bottom">
      Save
    </button>
    @if (!isNew()) {
      <button appShortcutTooltip="Delete" shortcutId="global.delete" shortcutTooltipPosition="bottom" pButton type="button" severity="danger" [disabled]="deleting()" (click)="deleteRecord()">
        Delete
      </button>
    }
    <button appShortcutTooltip="Back" shortcutId="global.cancel" shortcutTooltipPosition="bottom" pButton type="button" severity="secondary" variant="outlined" (click)="goBack()">
      Back
    </button>
  </div>
  @if (errorMessage()) {
    <p class="detail-form__error">{{ errorMessage() }}</p>
  }
</form>
