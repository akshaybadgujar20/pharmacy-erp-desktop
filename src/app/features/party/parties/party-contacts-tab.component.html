<div class="nested-tab">
  <div class="nested-tab__actions">
    <button pButton type="button" severity="primary" (click)="openCreate()">New Contact</button>
  </div>
  <app-grid
    [config]="gridConfig"
    [data]="rows()"
    [loading]="loading()"
    [totalRecords]="totalRecords()"
    (pageChange)="onPageChange($event)"
    (filterChange)="onFilterChange($event)"
    (action)="onGridAction($event)"
  />
</div>

<p-dialog
  [visible]="dialogVisible()"
  [modal]="true"
  [header]="editingId() ? 'Edit Contact' : 'New Contact'"
  [style]="{ width: '28rem' }"
  (onHide)="closeDialog()"
>
  <form class="detail-form" [formGroup]="form" (ngSubmit)="save()">
    <div class="detail-form__field">
      <label for="contactType">Contact Type</label>
      <input pInputText id="contactType" formControlName="contactType" />
    </div>
    <div class="detail-form__field">
      <label for="contactValue">Contact Value</label>
      <input pInputText id="contactValue" formControlName="contactValue" />
    </div>
    <div class="detail-form__field">
      <label for="countryCode">Country Code</label>
      <input pInputText id="countryCode" formControlName="countryCode" />
    </div>
    <div class="detail-form__field">
      <p-checkbox formControlName="isPrimary" [binary]="true" inputId="contactIsPrimary" />
      <label for="contactIsPrimary">Primary</label>
    </div>
    <div class="detail-form__field">
      <p-checkbox formControlName="isActive" [binary]="true" inputId="contactIsActive" />
      <label for="contactIsActive">Active</label>
    </div>
    <div class="detail-form__actions">
      <button pButton type="submit" severity="primary" [disabled]="saving() || form.invalid">
        Save
      </button>
      <button pButton type="button" severity="secondary" variant="outlined" (click)="closeDialog()">
        Cancel
      </button>
    </div>
  </form>
</p-dialog>
